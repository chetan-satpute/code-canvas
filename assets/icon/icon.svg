    <circle cx="256" cy="176" r="124" fill="url(#gold-glow)"/>
    <circle cx="256" cy="176" r="58" fill="url(#gold)"/>
    <circle cx="150" cy="356" r="44" fill="url(#pearl)"/>
    <circle cx="362" cy="356" r="44" fill="url(#pearl)"/>
