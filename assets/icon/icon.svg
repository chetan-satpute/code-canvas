<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b356e"/>
      <stop offset="1" stop-color="#0e1125"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6572bd" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#6572bd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gold-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d5be8b" stop-opacity="0.42"/>
