<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3e6dae"/>
      <stop offset="1" stop-color="#1b3557"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5d89c5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#5d89c5" stop-opacity="0"/>
    </radialGradient>
    <filter id="gold-glow" x="-1" y="-1" width="3" height="3">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e1d5b9"/>
      <stop offset="0.5" stop-color="#cca757"/>
      <stop offset="1" stop-color="#97752b"/>
    </linearGradient>
    <linearGradient id="pearl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fcfcfa"/>
      <stop offset="0.5" stop-color="#f4efe2"/>
      <stop offset="1" stop-color="#ded5bc"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect x="40" y="40" width="432" height="432" fill="url(#halo)"/>

  <g id="tree" transform="translate(256 256) scale(0.86) translate(-256 -256)">
    <g stroke="#f4efe2" stroke-opacity="0.75" stroke-width="16" stroke-linecap="round">
      <path d="M256 176 L140 346"/>
      <path d="M256 176 L372 346"/>
    </g>
    <rect x="161" y="128.5" width="190" height="95" rx="23.75" fill="#d5be8b" fill-opacity="0.95" filter="url(#gold-glow)"/>
    <rect x="186" y="141" width="140" height="70" rx="17.5" fill="url(#gold)"/>
    <rect x="70" y="311" width="140" height="70" rx="17.5" fill="url(#pearl)"/>
    <rect x="302" y="311" width="140" height="70" rx="17.5" fill="url(#pearl)"/>
  </g>
</svg>
